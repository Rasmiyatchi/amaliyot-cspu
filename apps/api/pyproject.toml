[project]
name = "chdpu-api"
version = "0.1.0"
description = "CHDPU amaliyot platformasi — FastAPI backend"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  # Validation & settings
  "pydantic>=2.9.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  # Cache / queue
  "redis[hiredis]>=5.2.0",
  # Security
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt==4.0.1",  # passlib compat
  # Logging
  "loguru>=0.7.2",
  # HTTP client
  "httpx>=0.27.2",
  "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Ruff ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle + pyflakes
  "I",            # isort
  "B",            # flake8-bugbear
  "UP",           # pyupgrade
  "N",            # pep8-naming
  "ASYNC",        # flake8-async
  "S",            # bandit (security)
  "C4",           # comprehensions
  "SIM",          # simplify
  "RET",          # return
  "PTH",          # pathlib
]
ignore = [
  "S101",   # assert used (OK in tests)
  "B008",   # function call in argument defaults (FastAPI Depends)
  "UP046",  # PEP 695 class type params — Pydantic compat edge cases
  "UP047",  # PEP 695 function type params — keeping TypeVar for consistency
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]  # bandit rules relaxed in tests
# Alembic generates files — not our style to enforce
"alembic/versions/**" = ["E501", "N999", "W291", "UP035", "UP006", "UP007", "I001"]
"alembic/env.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ─────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "openpyxl.*"]
ignore_missing_imports = true

# ─── Pyright / basedpyright (IDE) ─────────────────────────
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false

# ─── pytest ───────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
