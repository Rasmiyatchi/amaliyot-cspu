# Edge reverse proxy (host-level Nginx on the VPS)
# Bu fayl /etc/nginx/sites-available/chdpu.conf ga nusxalanadi.
# TLS uchun certbot --nginx ishlatiladi.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name chdpu.example.uz qr.chdpu.example.uz;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chdpu.example.uz;

    # Certificates (certbot avto-yangilab turadi)
    ssl_certificate /etc/letsencrypt/live/chdpu.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chdpu.example.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # File upload limit (HEMIS Excel, contract scan, avatar)
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
    gzip_min_length 1024;

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Static SPA (web container)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Public QR verify subdomain (no auth)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qr.chdpu.example.uz;

    ssl_certificate /etc/letsencrypt/live/qr.chdpu.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qr.chdpu.example.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Same SPA — frontend handles /verify/:token route
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
