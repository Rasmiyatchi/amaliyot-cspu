# Production stack — VPS uchun.
# Ishga tushirish:
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.prod up -d
# Edge Nginx (TLS + domen) hostda alohida ishlaydi va 127.0.0.1:8000/8080 ga proxy qiladi.

name: chdpu-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chdpu}
      POSTGRES_USER: ${POSTGRES_USER:-chdpu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env.prod da bo'lishi shart}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chdpu} -d ${POSTGRES_DB:-chdpu}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Faqat ichkarida — tashqi port ochmaymiz

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?APP_URL kerak}
      WEB_URL: ${WEB_URL:?WEB_URL kerak}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chdpu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chdpu}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak (openssl rand -hex 32)}
      JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?SUPERADMIN_PASSWORD kerak}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@chdpu.uz}
    volumes:
      - apistorage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
  redisdata:
  apistorage:
