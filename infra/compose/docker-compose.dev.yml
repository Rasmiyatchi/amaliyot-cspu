# Lokal dev compose — faqat infra (Postgres + Redis)
# API va Web hostda native ishlaydi (pnpm dev, uvicorn).
#
# Ishga tushirish:
#   docker compose -f infra/compose/docker-compose.dev.yml up -d

name: chdpu-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chdpu_dev
      POSTGRES_USER: chdpu
      POSTGRES_PASSWORD: chdpu_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chdpu -d chdpu_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
